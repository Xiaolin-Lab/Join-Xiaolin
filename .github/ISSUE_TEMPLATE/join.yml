name: "🚀 Join Xiaolin Lab"
description: "Apply to join the Xiaolin Lab community."
title: "[Join Request] "
labels:
  - "join-request"
body:
  - type: markdown
    attributes:
      value: |
        # 👋 Welcome to Xiaolin Lab

        Thanks for your interest in joining **Xiaolin Lab**!

        Xiaolin Lab is a community for developers and creators to
        share personal websites, projects, open-source work and ideas.

        Please complete the application below.

  - type: input
    id: github
    attributes:
      label: GitHub Username
      description: Please enter your GitHub username.
      placeholder: "@your-username"
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name or Nickname
      description: What name would you like to display in Xiaolin Lab?
      placeholder: "Your name"
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Personal Website
      description: Share your personal website or portfolio if you have one.
      placeholder: "https://example.com"

  - type: textarea
    id: about
    attributes:
      label: About You
      description: Tell us a little about yourself.
      placeholder: "I'm a developer interested in..."
    validations:
      required: true

  - type: textarea
    id: projects
    attributes:
      label: Projects or Works
      description: Share some projects, repositories, products or other work.
      placeholder: |
        Project name:
        https://github.com/username/project

  - type: checkboxes
    id: interests
    attributes:
      label: Interests
      description: What are you interested in?
      options:
        - label: AI
        - label: Web Development
        - label: Open Source
        - label: App Development
        - label: Design
        - label: Indie Development
        - label: Other

  - type: textarea
    id: reason
    attributes:
      label: Why do you want to join Xiaolin Lab?
      description: Tell us why you'd like to become part of the community.
      placeholder: "I'd like to join because..."
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: Community Agreement
      options:
        - label: I agree to respect other community members and keep shared content appropriate.
          required: true
